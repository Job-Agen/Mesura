name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # PostgreSQL 16 comes preinstalled on this image; starting it avoids pulling a Docker image,
    # whose registry mirrors often refuse shared runners ("Data limit exceeded").
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://mesura:mesura@localhost:5432/mesura?schema=public
      DIRECT_URL: postgresql://mesura:mesura@localhost:5432/mesura?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      SANDBOX_MODE: 'true'
      SANDBOX_FUNDING_AUTO_CONFIRM_SECONDS: '10'
    steps:
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          timeout 30 bash -c 'until pg_isready -h localhost; do sleep 1; done'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER mesura WITH PASSWORD 'mesura' CREATEDB;" \
            -c "CREATE DATABASE mesura OWNER mesura;"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate and seed
        run: |
          pnpm --filter @mesura/api prisma:deploy
          pnpm db:seed
      - name: API smoke test
        run: |
          pnpm --filter @mesura/api build
          node apps/api/dist/main.js > api.log 2>&1 &
          # Wait until the API answers (an unauthenticated request returns a JSON 401).
          timeout 60 bash -c 'until curl -s localhost:3000/me | grep -q statusCode; do sleep 1; done'
          pnpm --filter @mesura/api smoke
      - if: failure()
        run: cat api.log || true
